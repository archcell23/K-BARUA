<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="theme-color" content="#060606">
<title>Kamanashish Barua — Architecture / Selected Works</title>
<meta name="description" content="Selected architectural works of Kamanashish Barua, B.Arch (BUET), BIMSTEC Scholar. Architecture, urban design, landscape, interior, engineering, research.">
<meta property="og:title" content="Kamanashish Barua — Architecture / Selected Works">
<meta property="og:type" content="website">
<meta property="og:description" content="A curated archive of architectural works — Bangladesh and beyond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@300;400;500;600&family=Noto+Serif+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#ffffff; --ink:#080808; --ink-2:#232323;
  --grey-1:#666666; --grey-2:#9a9a9a; --grey-3:#c9c9c9;
  --line:#e4e4e4; --line-2:#cfcfcf; --paper:#f4f3f1;
  --display:'Archivo',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --bn:'Hind Siliguri',sans-serif;
  --bn-serif:'Noto Serif Bengali',serif;
  --maxw:1520px;
  --pad:clamp(18px,5vw,64px);
  --ease:cubic-bezier(.16,1,.3,1);
}
html[data-lang="bn"]{ --body:var(--bn); }
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
html[data-lang="bn"] body{line-height:1.75}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;border-radius:0}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit;border-radius:0}
::selection{background:#000;color:#fff}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:.98;letter-spacing:-.035em}
html[data-lang="bn"] h1,html[data-lang="bn"] h2,html[data-lang="bn"] h3{font-family:var(--bn-serif);letter-spacing:0;line-height:1.2}
.mono{font-family:var(--mono);letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--grey-1)}
.eyebrow::before{content:"";display:inline-block;width:16px;height:1px;background:currentColor;margin-right:9px;vertical-align:middle;opacity:.6}
html[data-lang="bn"] .eyebrow{font-family:var(--mono)}
.hairline{height:1px;background:var(--line);width:100%}

/* scroll progress */
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:#fff;z-index:120;transition:width .1s linear;mix-blend-mode:difference}

/* top bar — permanent black chrome; transparent only while riding over the hero image */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);height:64px;background:rgba(6,6,6,.88);backdrop-filter:saturate(1.4) blur(14px);color:#fff;
  border-bottom:1px solid transparent;transition:background .4s var(--ease),border-color .4s var(--ease),color .4s var(--ease)}
#topbar.solid{border-bottom-color:rgba(255,255,255,.14)}
#topbar.hero-mode{background:transparent;border-bottom-color:transparent}
.brand{display:flex;flex-direction:column;line-height:1;gap:4px}
.brand-name{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;color:#fff}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.tb-right{display:flex;align-items:center;gap:2px}
.tb-links{display:flex}
.tb-btn{position:relative;padding:9px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);transition:color .2s}
.tb-btn::after{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tb-btn:hover::after,.tb-btn.active::after{transform:scaleX(1)}
.tb-btn:hover{color:#fff}
.tb-btn.active{color:#fff}
.lang-toggle{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.32);padding:6px 10px;transition:.2s var(--ease)}
.lang-toggle:hover{border-color:#fff;color:#fff}
.menu-btn{display:none}

/* layout */
#app{min-height:100vh;padding-bottom:80px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.section{padding:clamp(48px,9vw,130px) 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:40px;position:relative;padding-left:22px}
.section-head::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:2px;background:var(--ink)}
.section-title{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.03em}
.reveal{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* HERO */
.hero{position:relative;height:100svh;min-height:560px;width:100%;overflow:hidden;background:#0a0a0a}
.hero-media{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transform:scale(1.06);transition:opacity 1.5s var(--ease)}
.hero-slide.active{opacity:1;animation:kb 20s var(--ease) forwards}
@keyframes kb{to{transform:scale(1)}}
.hero-dots{position:absolute;right:var(--pad);bottom:34px;z-index:2;display:flex;gap:8px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:.3s var(--ease)}
.hero-dot.on{background:#fff;width:22px;border-radius:3px}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.68) 100%)}
.hero::before{content:"";position:absolute;z-index:2;left:var(--pad);top:64px;width:min(46vw,620px);height:min(46vw,620px);
  border:1px solid rgba(255,255,255,.16);border-radius:50% 50% 50% 4%/54% 54% 46% 46%;pointer-events:none;
  transform:rotate(-8deg);opacity:.55}
.hero-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--pad);padding-bottom:clamp(90px,14vh,150px);color:#fff}
.hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:20px}
.hero-name{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,124px);line-height:.9;letter-spacing:-.045em;max-width:17ch}
html[data-lang="bn"] .hero-name{font-family:var(--bn-serif);letter-spacing:0;line-height:1.1;font-size:clamp(30px,7.5vw,84px)}
.hero-disc{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.hero-cta{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;padding:14px 24px;border:1px solid rgba(255,255,255,.5);color:#fff;transition:.3s var(--ease)}
.btn:hover{background:#fff;color:#000;border-color:#fff;letter-spacing:.22em}
.btn-dark{border-color:var(--ink);color:var(--ink)}
.btn-dark:hover{background:var(--ink);color:#fff}
.btn-fill{background:#fff;color:#000;border-color:#fff}
.btn-fill:hover{background:transparent;color:#fff}
.hero-scroll{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.7);
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.hero-scroll span{display:block;width:1px;height:34px;background:rgba(255,255,255,.5);margin:8px auto 0;animation:drop 2s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}
  55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:820px){.hero::before{display:none}}

/* FEATURED STREAM */
.feat{border-top:1px solid var(--line)}
.feat-item{position:relative;display:block;border-bottom:1px solid var(--line);overflow:hidden}
.feat-media{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--paper)}
@media(min-width:900px){.feat-media{aspect-ratio:21/9}}
.feat-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.feat-item:hover .feat-media img{transform:scale(1.045)}
.feat-cap{position:absolute;left:0;right:0;bottom:0;padding:var(--pad);color:#fff;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.68));z-index:2}
.feat-idx{font-family:var(--mono);font-size:11px;letter-spacing:.24em;opacity:.85}
.feat-title{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.8vw,58px);letter-spacing:-.035em;margin:8px 0 10px;max-width:20ch}
html[data-lang="bn"] .feat-title{font-family:var(--bn-serif);letter-spacing:0}
.feat-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.feat-idea{margin-top:14px;font-size:15px;max-width:60ch;color:rgba(255,255,255,.9);font-family:var(--body)}
.feat-item::before{content:"";position:absolute;top:22px;right:22px;z-index:3;width:28px;height:28px;border:1px solid rgba(255,255,255,.6);
  border-radius:50%;opacity:0;transform:scale(.6) rotate(-30deg);transition:.4s var(--ease)}
.feat-item::after{content:"→";position:absolute;top:22px;right:22px;z-index:3;width:28px;height:28px;display:grid;place-items:center;
  color:#fff;font-size:13px;opacity:0;transform:scale(.6) rotate(-30deg);transition:.4s var(--ease)}
.feat-item:hover::before,.feat-item:hover::after{opacity:1;transform:none}

/* ARCHIVE */
.filterbar{position:sticky;top:64px;z-index:40;background:rgba(6,6,6,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.12);padding:14px var(--pad)}
.filter-row{display:flex;gap:14px;align-items:center}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 14px;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.65);transition:.25s var(--ease);flex:0 0 auto}
.chip:hover{border-color:#fff;color:#fff}
.chip.active{background:#fff;color:#000;border-color:#fff}
.view-toggle{display:flex;border:1px solid rgba(255,255,255,.28);flex:0 0 auto}
.view-toggle button{padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.65);transition:.2s}
.view-toggle button.active{background:#fff;color:#000}
.searchbtn{flex:0 0 auto;padding:9px 13px;border:1px solid rgba(255,255,255,.28);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.65);transition:.2s var(--ease)}
.searchbtn:hover{border-color:#fff;color:#fff}

.grid{display:grid;gap:clamp(20px,3vw,44px);grid-template-columns:1fr}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid.three{grid-template-columns:1fr 1fr 1fr}}
.card{display:block;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.card.in{opacity:1;transform:none}
.card-media{position:relative;overflow:hidden;background:var(--paper);aspect-ratio:4/3}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s}
.card:hover .card-media img{transform:scale(1.05)}
.card-fav{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;display:grid;place-items:center;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);color:var(--ink);font-size:15px;opacity:0;transition:.25s}
.card:hover .card-fav,.card-fav.on{opacity:1}
.card-fav.on{color:#000}
.card-body{padding:16px 2px 0;position:relative}
.card-title{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.1}
html[data-lang="bn"] .card-title{font-family:var(--bn-serif)}
.card-meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-1)}

/* INDEX list view */
.indexlist{border-top:2px solid var(--ink)}
.index-row{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:20px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:.3s var(--ease)}
.index-row:hover{background:var(--paper);padding-left:14px}
.index-no{font-family:var(--mono);font-size:12px;color:var(--grey-2)}
.index-t{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,28px);letter-spacing:-.02em}
html[data-lang="bn"] .index-t{font-family:var(--bn-serif)}
.index-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-1);margin-top:4px}
.index-year{font-family:var(--mono);font-size:13px;color:var(--grey-1);text-align:right}
.empty{padding:80px 0;text-align:center;color:var(--grey-1);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* DETAIL */
.d-hero{position:relative;height:86svh;min-height:480px;overflow:hidden;background:#0a0a0a}
.d-hero img{width:100%;height:100%;object-fit:cover}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 40%,rgba(0,0,0,.68))}
.d-hero-cap{position:absolute;left:0;right:0;bottom:0;padding:var(--pad);color:#fff;z-index:2}
.d-cat{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.d-title{font-family:var(--display);font-weight:800;font-size:clamp(32px,6.8vw,84px);line-height:.92;letter-spacing:-.04em;margin:14px 0 12px;max-width:18ch}
html[data-lang="bn"] .d-title{font-family:var(--bn-serif);letter-spacing:0;line-height:1.15}
.d-locyear{display:flex;gap:24px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.backbar{padding:16px var(--pad);border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center;position:sticky;top:64px;background:rgba(6,6,6,.92);backdrop-filter:blur(8px);z-index:40}
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.backlink:hover{color:#fff}
.d-actions{display:flex;gap:6px}
.d-actions button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);padding:7px 11px;border:1px solid rgba(255,255,255,.25);transition:.2s var(--ease)}
.d-actions button:hover{color:#000;border-color:#fff;background:#fff}

/* title block (signature) */
.titleblock{border:1px solid var(--ink);margin:clamp(40px,8vw,80px) 0}
.tb-grid{display:grid;grid-template-columns:1fr;border-collapse:collapse}
@media(min-width:640px){.tb-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.tb-grid{grid-template-columns:1fr 1fr 1fr}}
.tb-cell{padding:18px 20px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.tb-key{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey-2);margin-bottom:7px}
.tb-val{font-family:var(--body);font-size:14.5px;color:var(--ink);line-height:1.4}
html[data-lang="bn"] .tb-val{font-family:var(--bn)}
.d-body{max-width:760px;margin:0 auto}
.d-intro{font-size:clamp(18px,2.4vw,24px);line-height:1.45;font-family:var(--display);font-weight:400;letter-spacing:-.015em;color:var(--ink-2);margin:8px 0 clamp(40px,7vw,72px)}
html[data-lang="bn"] .d-intro{font-family:var(--bn-serif);line-height:1.7}
.d-sec{margin-bottom:clamp(34px,5vw,52px)}
.d-sec h3{font-size:12.5px;font-family:var(--mono);font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--grey-1);margin-bottom:16px;padding-left:16px;border-left:2px solid var(--ink)}
html[data-lang="bn"] .d-sec h3{font-family:var(--mono)}
.d-sec p{font-size:16px;color:var(--ink-2);margin-bottom:14px}
.d-sec p:last-child{margin-bottom:0}

/* gallery */
.gallery{margin:clamp(44px,8vw,90px) 0}
.g-full{margin:26px 0}
.g-two{display:grid;grid-template-columns:1fr;gap:14px;margin:26px 0}
@media(min-width:700px){.g-two{grid-template-columns:1fr 1fr}}
.g-three{display:grid;grid-template-columns:1fr;gap:14px;margin:26px 0}
@media(min-width:700px){.g-three{grid-template-columns:2fr 1fr}.g-three .gi:first-child{grid-row:span 2}}
.gi{position:relative;overflow:hidden;background:var(--paper);cursor:zoom-in}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.gi:hover img{transform:scale(1.04)}
.gi-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--grey-1);margin-top:9px;text-transform:uppercase}
.g-swipe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:26px calc(-1*var(--pad));padding:0 var(--pad);scrollbar-width:none}
.g-swipe::-webkit-scrollbar{display:none}
.g-swipe .gi{flex:0 0 82%;scroll-snap-align:center;aspect-ratio:3/2}
@media(min-width:800px){.g-swipe .gi{flex:0 0 46%}}

/* drawings */
.draw-strip{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.draw-strip{grid-template-columns:1fr 1fr}}
.draw{border:1px solid var(--line);background:var(--paper);cursor:zoom-in;position:relative}
.draw img{width:100%;object-fit:contain;background:#fff}
.draw-lab{position:absolute;top:0;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;padding:6px 10px}

/* sustainability tags */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line-2);padding:9px 13px;color:var(--ink-2);transition:.2s var(--ease)}
.tag:hover{border-color:var(--ink);color:var(--ink)}

/* related / next */
.next-proj{position:relative;height:60svh;min-height:360px;overflow:hidden;display:block;background:#0a0a0a;margin-top:clamp(50px,8vw,90px)}
.next-proj img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.next-proj:hover img{transform:scale(1.06)}
.next-proj::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.46)}
.next-cap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;padding:var(--pad)}
.next-lab{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;margin-bottom:16px}
.next-t{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vw,66px);letter-spacing:-.03em}
html[data-lang="bn"] .next-t{font-family:var(--bn-serif)}

/* video */
.videowrap{position:relative;aspect-ratio:16/9;background:#000;margin:26px 0}
.videowrap iframe,.videowrap video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* about */
.about-hero{padding:clamp(60px,12vw,140px) 0 clamp(30px,6vw,60px)}
.about-name{font-size:clamp(36px,7.4vw,96px);font-weight:800;letter-spacing:-.04em;line-height:.92}
.about-cols{display:grid;grid-template-columns:1fr;gap:clamp(30px,5vw,60px)}
@media(min-width:900px){.about-cols{grid-template-columns:1fr 1.4fr}}
.about-portrait{background:var(--paper);aspect-ratio:3/4;overflow:hidden}
.about-portrait img{width:100%;height:100%;object-fit:cover}
.about-block{margin-bottom:38px}

    intro:{en:"A forest meditation centre for a roughly 200-acre site in Panchhari, Khagrachhari, designed around climate-responsive and ecologically sensitive architecture. The proposal prioritises forest preservation over land clearing — dense tree canopy reduces solar radiation and ambient temperature, creating conditions suited to meditation, so the forest becomes integral to the experience rather than a backdrop to it.",bn:""},

  bio:{en:"Kamanashish Barua is a Bangladeshi architect with over 14 years of experience in architectural design, interior solutions and sustainable space planning, working across residential, commercial, urban and institutional projects. As Principal Architect and Co-Founder of ARCHCELL, he leads a team delivering architectural and interior design solutions across Bangladesh and beyond — from concept development to site execution — ensuring every design meets client needs, regulatory standards and sustainable goals.",bn:""},

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.projects)return d;}}catch(e){}
 try{const t=document.getElementById("embedded-data");if(t){const d=JSON.parse(t.textContent);if(d&&d.projects){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}return d;}}}catch(e){}
 const s=seed();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}return s;}
const HKEY=KEY+"_history";
function getHistory(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]");}catch(e){return [];}}
function save(){
 try{
   const prev=localStorage.getItem(KEY);
   if(prev){
     let hist=getHistory();
     hist.unshift({ts:Date.now(),data:prev});
     hist=hist.slice(0,5);
     try{localStorage.setItem(HKEY,JSON.stringify(hist));}catch(e){}
   }
   localStorage.setItem(KEY,JSON.stringify(DB));
 }catch(e){toast("⚠ Storage full — this change did NOT save. Remove some uploaded images or use smaller photos, then try again.",5000);}
}
function restoreHistory(i){
 const hist=getHistory();const snap=hist[i];if(!snap)return;
 if(!confirm("Restore the version from "+new Date(snap.ts).toLocaleString()+"? This replaces everything currently on the site with that saved snapshot (your present state is itself kept in history, so this can be undone)."))return;
 try{DB=JSON.parse(snap.data);}catch(e){toast("Couldn't read that version");return;}
 save();toast("Restored — pick a newer version below to undo this");renderAdmin();
}

/* reveal observer */

/* ============================ LIGHTBOX ============================ */
let lb={items:[],i:0,zoom:1,x:0,y:0};
function openLightbox(items,i){
 lb.items=items||[];lb.i=i||0;lb.zoom=1;lb.x=0;lb.y=0;
 $("#lightbox").classList.add("open");document.body.style.overflow="hidden";lbShow();
}
function lbShow(){
 const it=lb.items[lb.i]||{};
 $("#lbImg").src=it.url;lb.zoom=1;lb.x=0;lb.y=0;applyLbTransform();
 $("#lbCount").textContent=`${String(lb.i+1).padStart(2,"0")} / ${String(lb.items.length).padStart(2,"0")}`;
 $("#lbCap").textContent=[it.caption,it.credit].filter(Boolean).join(" — ");
}
function applyLbTransform(){$("#lbImg").style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.zoom})`;$("#lbImg").style.cursor=lb.zoom>1?"grab":"default";}
function lbNext(d){lb.i=(lb.i+d+lb.items.length)%lb.items.length;lbShow();}
function closeLb(){$("#lightbox").classList.remove("open");document.body.style.overflow="";}
$("#lbClose").onclick=closeLb;$("#lbPrev").onclick=()=>lbNext(-1);$("#lbNext").onclick=()=>lbNext(1);
$("#lbZoom").onclick=()=>{lb.zoom=lb.zoom>1?1:2.2;lb.x=0;lb.y=0;applyLbTransform();};
// zoom & drag & swipe
(function(){const st=$("#lbStage");let sx,sy,drag=false,px,py,pinch=0;
 st.addEventListener("dblclick",e=>{lb.zoom=lb.zoom>1?1:2.4;lb.x=0;lb.y=0;applyLbTransform();});
 st.addEventListener("pointerdown",e=>{if(lb.zoom>1){drag=true;px=e.clientX-lb.x;py=e.clientY-lb.y;}sx=e.clientX;sy=e.clientY;});
 st.addEventListener("pointermove",e=>{if(drag){lb.x=e.clientX-px;lb.y=e.clientY-py;applyLbTransform();}});
 st.addEventListener("pointerup",e=>{if(!drag){const dx=e.clientX-sx;if(Math.abs(dx)>60&&lb.zoom<=1)lbNext(dx<0?1:-1);}drag=false;});
 st.addEventListener("wheel",e=>{if(e.ctrlKey||lb.zoom>1){e.preventDefault();lb.zoom=Math.min(4,Math.max(1,lb.zoom-e.deltaY*0.002));if(lb.zoom===1){lb.x=0;lb.y=0;}applyLbTransform();}},{passive:false});
})();

function reorder(id,dir){
 const ps=[...DB.projects].sort((a,b)=>(a.order||0)-(b.order||0));
 const i=ps.findIndex(x=>x.id===id);const j=i+dir;if(j<0||j>=ps.length)return;

}
function reorderDrag(fromId,toId){
 const ps=[...DB.projects].sort((a,b)=>(a.order||0)-(b.order||0));
 const from=ps.findIndex(x=>x.id===fromId);const to=ps.findIndex(x=>x.id===toId);
 if(from<0||to<0)return;

function buildUpdatedHtml(){

 if(!tag){tag=doc.createElement("script");tag.id="embedded-data";tag.type="application/json";doc.body.appendChild(tag);}

}
function admBackup(body){
 const hist=getHistory();
 body.innerHTML=`<div class="adm-h">Backup & Restore</div><div class="adm-note">All content lives in this browser. "Save updated HTML" bakes your current edits into a standalone file you can upload to replace index.html on your server — open it anywhere and it shows this content by default, no browser storage needed. Export a JSON backup too, for safety and for moving content between devices. Import replaces everything.</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="adm-primary" id="expHtmlBtn">⭳ Save updated HTML file</button>
   <button class="adm-tab" id="expBtn">⭳ Export backup (.json)</button>

 </div>

 <div id="histList" style="margin-top:6px">${hist.length?hist.map((h,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)">
     <span class="mono" style="font-size:12px;color:var(--grey-1)">${i===0?"Most recent — ":""}${new Date(h.ts).toLocaleString()}</span>

 $$("[data-restore]").forEach(b=>b.onclick=()=>restoreHistory(+b.dataset.restore));
}

/* ---- file helpers ---- */
function readFile(f,cb){
 const fr=new FileReader();
 fr.onload=()=>{
   if(!/^image\//.test(f.type)){cb(fr.result);return;}
   const img=new Image();
   img.onload=()=>{
     const maxDim=1600;let w=img.width,h=img.height;
     if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
     const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
     const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
     try{cb(canvas.toDataURL("image/jpeg",0.82));}catch(e){cb(fr.result);}
   };
   img.onerror=()=>cb(fr.result);
   img.src=fr.result;
 };
 fr.onerror=()=>toast("Couldn't read that file");
 fr.readAsDataURL(f);
}
function fileToData(input,cb){if(!input)return;input.onchange=e=>{const f=e.target.files[0];if(f)readFile(f,cb);};}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
